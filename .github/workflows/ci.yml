name: ci

on:
  # Pushes to develop are checked by deploy.yml; this covers bot PRs (Dependabot, catalog)
  pull_request:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Same base path as https://www.hohenegger.eu/CuppaScore/, so path bugs show up in PRs
      BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # version comes from package.json "packageManager"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint · types · layer rules · i18n · contrast
        run: pnpm run --if-present check

      - name: Unit & contract tests
        run: pnpm run --if-present test

      - name: Build (project-page base path)
        run: pnpm run build

      - name: Install Playwright browsers
        if: hashFiles('**/playwright.config.*') != ''
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: E2E tests
        if: hashFiles('**/playwright.config.*') != ''
        run: pnpm run test:e2e

      - name: Lighthouse PWA / a11y audit
        if: hashFiles('lighthouserc.*', '.lighthouserc.*') != ''
        run: pnpm dlx @lhci/cli autorun

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            **/playwright-report/
            **/test-results/
          retention-days: 7
          if-no-files-found: ignore
