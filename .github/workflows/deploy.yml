# Deploys the PWA as a project page of the user site treehopper.github.io, which has the
# custom domain www.hohenegger.eu → https://www.hohenegger.eu/CuppaScore/
# configure-pages reports the base path ("/CuppaScore"); the build derives Vite `base`,
# manifest start_url/scope/id, service worker scope and catalog.json URL from it.
name: deploy

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      has_app: ${{ steps.app.outputs.has_app }}
    steps:
      - uses: actions/checkout@v7

      # Until the monorepo is scaffolded there is nothing to build; skip instead of failing.
      - id: app
        run: echo "has_app=${{ hashFiles('package.json') != '' }}" >> "$GITHUB_OUTPUT"

      - id: pages
        if: steps.app.outputs.has_app == 'true'
        uses: actions/configure-pages@v6

      - if: steps.app.outputs.has_app == 'true'
        uses: pnpm/action-setup@v6

      - if: steps.app.outputs.has_app == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - if: steps.app.outputs.has_app == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.app.outputs.has_app == 'true'
        run: pnpm run --if-present check
      - if: steps.app.outputs.has_app == 'true'
        run: pnpm run --if-present test

      - name: Build
        if: steps.app.outputs.has_app == 'true'
        run: pnpm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          VITE_APP_VERSION: ${{ github.sha }}

      - name: Install Playwright browsers
        if: steps.app.outputs.has_app == 'true' && hashFiles('**/playwright.config.*') != ''
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: E2E tests
        if: steps.app.outputs.has_app == 'true' && hashFiles('**/playwright.config.*') != ''
        run: pnpm run test:e2e
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - if: steps.app.outputs.has_app == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/pwa/dist

  deploy:
    needs: build
    if: needs.build.outputs.has_app == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
