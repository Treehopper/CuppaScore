<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>CupLog</title>
    <meta name="description" content="Log and rate every cup of coffee." />
    <meta name="theme-color" content="#f7efe4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1e1410" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CupLog" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Pre-paint theme (no flash): mirrors resolveTheme() in src/themes/themes.ts.
      try {
        var p = JSON.parse(localStorage.getItem('cuplog:prefs') || '{}');
        var dark = matchMedia('(prefers-color-scheme: dark)').matches;
        var t = !p.theme || p.theme === 'system' ? (dark ? p.systemDark || 'espresso' : p.systemLight || 'crema') : p.theme;
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" sizes="180x180" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
